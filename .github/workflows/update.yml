name: "Update with the latest tinted-theming colorschemes"
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 0" # https://crontab.guru/every-week
  push:
    branches: [main]
    paths: ["templates/**"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build-and-commit:
    name: "Build and commit colorschemes"
    runs-on: "ubuntu-latest"
    permissions:
      contents: write # push regenerated colorschemes to main
    steps:
      - name: "Fetch the repository code"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Install tinted-builder-rust"
        uses: "jaxxstorm/action-install-gh-release@b82b2052fdf822192f2119b7e289a6f63e668bc8" # v4.0.0
        with:
          repo: "tinted-theming/tinted-builder-rust"

      - name: "Build"
        run: |
          tinted-builder-rust sync
          tinted-builder-rust build .

      - name: "Commit the changes, if any"
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Update with the latest tinted-theming colorschemes [skip ci]"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
